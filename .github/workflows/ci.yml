
name: ShopNest CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # JOB 1: BACKEND LINTING

  backend-lint:
    name: Backend Lint

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Ruff
        run: python -m ruff check backend


  # JOB 2: BACKEND TESTING
  # Test against multiple Python versions

  backend-tests:
    name: Backend Tests (Python ${{ matrix.python-version }})

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run backend tests
        working-directory: backend        
        run: python -m pytest -q


  # JOB 3: FRONTEND CHECKS

  frontend-checks:
    name: Frontend Checks

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: shopnest-frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7


  # JOB 4: DOCKER IMAGE BUILD

  docker-build:
    name: Docker Image Build

    runs-on: ubuntu-latest

    needs:
      - backend-lint
      - backend-tests
      - frontend-checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: shopnest-frontend-dist
          path: frontend/dist/

      - name: Build backend Docker image
        run: |
          docker build \
            -t shopnest-backend:ci \
            ./backend

      - name: Build frontend Docker image
        run: |
          docker build \
            -f frontend/Dockerfile.ci \
            -t shopnest-frontend:ci \
            ./frontend
